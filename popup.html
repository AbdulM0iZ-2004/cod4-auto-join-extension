<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body{ font-family: Arial; width: 240px; padding: 15px; background: #0f172a; color: white; }
h3{ text-align: center; margin: 0; }
.toggle-container{ display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
.switch{ position: relative; width: 50px; height: 26px; }
.switch input{ opacity: 0; }
.slider{ position: absolute; background: #ef4444; border-radius: 34px; top:0; left:0; right:0; bottom:0; cursor: pointer; transition: .3s; }
.slider:before{ content:""; position:absolute; height:20px; width:20px; left:3px; bottom:3px; background:white; border-radius:50%; transition:.3s; }
input:checked + .slider{ background:#22c55e; }
input:checked + .slider:before{ transform: translateX(24px); }
input[type="number"]{ width:100%; padding:6px; border-radius:6px; border:none; margin-top:5px; box-sizing: border-box; }
.status{ text-align:center; margin-top:15px; font-weight:bold; font-size: 14px; }

/* Pulse Animation for Live Status */
.pulse {
    display: inline-block;
    animation: pulse-animation 2s infinite;
}

@keyframes pulse-animation {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}
</style>
</head>
<body>
    <h3>Auto Join Queue</h3>
    <div class="toggle-container">
        <span>Enable Bot</span>
        <label class="switch">
            <input type="checkbox" id="toggle">
            <span class="slider"></span>
        </label>
    </div>
    <label>Delay (ms):</label>
    <input type="number" id="delay" value="500">
    <div class="status" id="status"></div>
    <script src="popup.js"></script>
</body>
</html>
